[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "igor-lancedb"
version = "0.1.0"
description = "IGOR LanceDB storage owner"
requires-python = ">=3.13,<3.14"
dependencies = ["igor-core", "lancedb==0.37.1"]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.sources]
igor-core = { path = "../core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.hatch.build.targets.wheel]
packages = ["src/igor_lancedb"]
