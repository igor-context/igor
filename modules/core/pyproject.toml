[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "igor-core"
version = "0.1.0"
description = "Tool-neutral contracts and deterministic primitives for IGOR"
requires-python = ">=3.13,<3.14"
dependencies = [
  "jsonschema==4.25.1",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
]

[project.scripts]
igor-core = "igor_core.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.hatch.build.targets.wheel]
packages = ["src/igor_core"]
