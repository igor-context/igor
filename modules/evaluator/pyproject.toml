[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "igor-evaluator"
version = "0.1.0"
description = "Artifact-only IGOR conformance and scenario evaluator"
requires-python = ">=3.13,<3.14"
dependencies = ["igor-core"]

[project.scripts]
igor-evaluator = "igor_evaluator.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv.sources]
igor-core = { path = "../core" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.hatch.build.targets.wheel]
packages = ["src/igor_evaluator"]
